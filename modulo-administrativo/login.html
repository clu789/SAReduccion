<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acceso Administrativo | Instituto Tecnológico de Toluca</title>
  <link rel="icon" type="image/png" href="img/logo.png" />
  <meta name="description" content="Acceso para personal administrativo de la Subdirección Académica del Instituto Tecnológico de Toluca." />
  <link rel="stylesheet" href="css/itt-base.css" />
  <link rel="stylesheet" href="css/administrativo.css" />
  <link rel="stylesheet" href="/compartido/css/itt-security.css" />
</head>
<body id="pagina-login-admin">
  <main class="login-admin-wrapper">
    <div class="login-admin-page">
      <header class="login-admin-institucion">
        <img
          src="img/header.png"
          alt="Tecnológico Nacional de México — Instituto Tecnológico de Toluca"
          class="login-admin-header-image"
        />
      </header>

      <nav class="login-admin-nav" aria-label="Navegación administrativa">
        <span>Gestión de Reducciones</span>
      </nav>

      <section class="login-admin-card" aria-labelledby="login-admin-titulo">
        <header class="login-admin-card-header">
          <h1 id="login-admin-titulo">Iniciar sesión</h1>
        </header>
        <div class="login-admin-card-body">
          <div id="alerta-login-admin" aria-live="polite"></div>

          <form id="form-login-admin" novalidate>
            <div class="form-group">
              <label for="usuario-admin">Usuario Administrativo <span class="requerido">*</span></label>
              <input
                type="text"
                id="usuario-admin"
                name="usuario-admin"
                class="form-control-itt"
                placeholder="ID de administrador"
                autocomplete="username"
                aria-describedby="usuario-admin-error"
                required
              />
              <span class="mensaje-error" id="usuario-admin-error"></span>
            </div>

            <div class="form-group">
              <label for="password-admin">Contraseña <span class="requerido">*</span></label>
              <div class="login-password-field">
                <input
                  type="password"
                  id="password-admin"
                  name="password-admin"
                  class="form-control-itt"
                  placeholder="Contraseña"
                  autocomplete="current-password"
                  aria-describedby="password-admin-error"
                  required
                />
                <button
                  type="button"
                  id="toggle-password-admin"
                  class="login-password-toggle"
                  aria-label="Mostrar contraseña"
                  aria-controls="password-admin"
                  aria-pressed="false"
                >Mostrar</button>
              </div>
              <span class="mensaje-error" id="password-admin-error"></span>
            </div>

            <div id="captcha-login-admin" data-itt-captcha></div>

            <button type="submit" id="btn-login-admin" class="btn-itt btn-primario w-100 btn-login-admin">
              <span class="login-button-spinner" aria-hidden="true" hidden></span>
              <span class="btn-login-admin-text">Acceder al Panel</span>
            </button>
          </form>

          <p class="login-admin-aviso">
            Acceso restringido a personal autorizado de la <strong>Subdirección Académica</strong>.
          </p>
        </div>
      </section>

      <footer class="login-admin-footer">
        Instituto Tecnológico de Toluca <span aria-hidden="true">|</span> Subdirección Académica
      </footer>
    </div>
  </main>

  <script src="/compartido/js/itt-security.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
