# Configuración de producción: TLS en Nginx, OTP obligatorio para aspirantes,
# y acceso a backend/Oracle solo por la red privada de Compose.
services:
  oracle-db:
    ports: !reset []
    environment:
      SAR_LOAD_DEV_SEED: "false"

  backend:
    ports: !reset []
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod},smtp-production,prod
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:?Definir host SMTP}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      SAR_MAIL_FROM: ${SAR_MAIL_FROM:?Definir remitente autorizado}
      SESSION_COOKIE_SECURE: "true"
      SAR_OTP_ENABLED: "true"
      SAR_OTP_LOG_CODE: "false"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: ${SMTP_AUTH:-true}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: ${SMTP_STARTTLS_ENABLE:-true}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED: ${SMTP_STARTTLS_ENABLE:-true}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_ENABLE: ${SMTP_SSL_ENABLE:-false}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_CHECKSERVERIDENTITY: "true"
      SMTP_TEST_CONNECTION: ${SMTP_TEST_CONNECTION:-true}
      SMTP_ALLOW_PLAINTEXT: ${SMTP_ALLOW_PLAINTEXT:-false}

  frontend:
    ports: !override
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes: !override
      - ./modulo-administrativo:/usr/share/nginx/html/administrativo:ro
      - ./modulo-solicitante:/usr/share/nginx/html/solicitante:ro
      - ./modulo-compartido:/usr/share/nginx/html/compartido:ro
      - ./docker/nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - type: bind
        source: ${TLS_CERT_PATH:?Definir TLS_CERT_PATH}
        target: /etc/nginx/tls/fullchain.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${TLS_KEY_PATH:?Definir TLS_KEY_PATH}
        target: /etc/nginx/tls/privkey.pem
        read_only: true
        bind:
          create_host_path: false
