# ============================================================
# SAReduccion - Entorno de desarrollo con Docker Compose
#
# Requisitos:
#   - Archivo .env local (NO subirlo a Git)
#   - Scripts SQL de inicializacion validados en docker/init-db/
#
# Comandos habituales (desde la raiz del proyecto):
#   docker compose up -d oracle-db
#   docker compose --profile full-stack up -d
#   docker compose ps
#   docker compose down            # Conserva el volumen de Oracle
#
# ADVERTENCIA: docker compose down -v ELIMINA el volumen
# sareduccion_oracle_data y puede causar perdida de datos.
# ============================================================

services:
  oracle-db:
    image: gvenzl/oracle-xe:21-slim
    container_name: sareduccion-oracle
    restart: unless-stopped

    environment:
      # Do not pass ORACLE_DATABASE to the image: XE already provides XEPDB1.
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:?Define ORACLE_PASSWORD en .env}
      SAR_ORACLE_DATABASE: ${ORACLE_DATABASE:-XEPDB1}
      ORACLE_APP_USER: ${ORACLE_APP_USER:?Define ORACLE_APP_USER en .env}
      ORACLE_APP_PASSWORD: ${ORACLE_APP_PASSWORD:?Define ORACLE_APP_PASSWORD en .env}
      ORACLE_ALUMNO_USER: ${ORACLE_ALUMNO_USER:?Define ORACLE_ALUMNO_USER en .env}
      ORACLE_ALUMNO_PASSWORD: ${ORACLE_ALUMNO_PASSWORD:?Define ORACLE_ALUMNO_PASSWORD en .env}
      ORACLE_ADMIN_USER: ${ORACLE_ADMIN_USER:?Define ORACLE_ADMIN_USER en .env}
      ORACLE_ADMIN_PASSWORD: ${ORACLE_ADMIN_PASSWORD:?Define ORACLE_ADMIN_PASSWORD en .env}

    ports:
      # Puerto local : puerto dentro del contenedor
      - "${ORACLE_PORT:-1522}:1521"

    volumes:
      # Datos persistentes: NO eliminar este volumen.
      - oracle_data:/opt/oracle/oradata
      # Only the orchestrator runs automatically; SQL scripts are connected explicitly.
      - ./docker/init-db/init-db.sh:/container-entrypoint-initdb.d/00-init-db.sh:ro
      - ./docker/init-db:/opt/sareduccion/init-db:ro

    healthcheck:
      # Comprueba la disponibilidad de Oracle sin incluir contrasenas.
      # Script de comprobacion provisto por gvenzl/oracle-xe.
      test: ["CMD-SHELL", "healthcheck.sh && test -f /opt/oracle/oradata/.sareduccion-init.complete"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sareduccion-backend
    restart: unless-stopped

    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      # El nombre oracle-db se resuelve dentro de la red de Compose.
      DB_URL: jdbc:oracle:thin:@//oracle-db:1521/${ORACLE_DATABASE:-XEPDB1}
      DB_USER: ${ORACLE_APP_USER:?Define ORACLE_APP_USER en .env}
      DB_PASSWORD: ${ORACLE_APP_PASSWORD:?Define ORACLE_APP_PASSWORD en .env}

    ports:
      - "${APP_PORT:-8080}:8080"

    depends_on:
      oracle-db:
        condition: service_healthy

    # Iniciar con: docker compose --profile full-stack up -d
    profiles:
      - full-stack

  frontend:
    image: nginx:alpine
    container_name: sareduccion-frontend
    restart: unless-stopped

    ports:
      - "8081:80"

    volumes:
      - ./modulo-administrativo:/usr/share/nginx/html/administrativo:ro
      - ./modulo-solicitante:/usr/share/nginx/html/solicitante:ro
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  oracle_data:
    # Mantener este nombre para reutilizar los datos existentes.
    name: sareduccion_oracle_data

networks:
  default:
    name: sareduccion-net
