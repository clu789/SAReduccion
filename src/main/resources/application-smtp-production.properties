# Perfil adicional para el correo en el despliegue real.
spring.mail.default-encoding=UTF-8
spring.mail.test-connection=${SMTP_TEST_CONNECTION:true}
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.debug=false
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS_ENABLE:true}
