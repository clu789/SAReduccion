spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.type=com.zaxxer.hikari.HikariDataSource
spring.datasource.hikari.pool-name=SAReduccionOraclePool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000

# ---------------------------------------------------------------------------
# Sesion (Equipo 1). La expiracion es por inactividad: cada peticion la renueva.
# ---------------------------------------------------------------------------
server.servlet.session.timeout=${SAR_SESSION_TIMEOUT:30m}
# El identificador de sesion viaja solo en cookie, nunca en la URL.
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
# Lax y no Strict: con Strict, quien llega desde un enlace externo (por ejemplo
# el correo de notificacion) apareceria sin sesion. Las operaciones que
# modifican datos estan cubiertas ademas por el token CSRF.
server.servlet.session.cookie.same-site=lax
# Activar (true) en cualquier despliegue servido por HTTPS.
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# ---------------------------------------------------------------------------
# IP real del cliente detras de Nginx (Equipo 1).
# "native" usa RemoteIpValve de Tomcat: solo acepta X-Forwarded-For y
# X-Forwarded-Proto cuando la conexion llega desde un proxy de confianza
# (internal-proxies). Desde cualquier otro origen esas cabeceras se ignoran y
# request.getRemoteAddr() devuelve la IP de la conexion.
# Por omision se confia en la red interna de Docker (172.16.0.0/12) y loopback.
# ---------------------------------------------------------------------------
server.forward-headers-strategy=native
server.tomcat.remoteip.remote-ip-header=X-Forwarded-For
server.tomcat.remoteip.protocol-header=X-Forwarded-Proto
server.tomcat.remoteip.internal-proxies=${SAR_TRUSTED_PROXIES:172\\.(1[6-9]|2\\d|3[01])\\.\\d+\\.\\d+|127\\.\\d+\\.\\d+\\.\\d+}

# Las respuestas de error nunca exponen trazas ni mensajes internos.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false

# ---------------------------------------------------------------------------
# Controles de acceso (Equipo 1). Ver GUIA_INTEGRACION_SEGURIDAD.md
# ---------------------------------------------------------------------------
# Intentos fallidos permitidos por usuario y por IP dentro de la ventana.
sar.auth.max-attempts=5
sar.auth.max-attempts-per-origin=20
sar.auth.attempt-window-seconds=900
# Captcha en los tres inicios de sesion.
sar.security.captcha.enabled=${SAR_CAPTCHA_ENABLED:true}
sar.security.captcha.ttl-seconds=180
# Codigo temporal por correo para aspirantes. Requiere un bean OtpDelivery
# (servicio de correo del Equipo 6). log-code=true solo en desarrollo.
sar.security.otp.enabled=${SAR_OTP_ENABLED:false}
sar.security.otp.log-code=${SAR_OTP_LOG_CODE:false}
sar.security.otp.ttl-seconds=600
sar.security.otp.max-attempts=5
sar.security.otp.resend-cooldown-seconds=60
# Auditoria de accesos en Oracle (SEG_AUDITORIA_ACCESOS).
sar.security.audit.database-enabled=true
# Reglas de rol adicionales: /api/ruta/**=ADMIN,STUDENT;/api/otra/**=APPLICANT
sar.security.role-rules=
sar.security.hsts-max-age-seconds=31536000

# Logs: directorio de los archivos rotados (ver logback-spring.xml).
sar.logging.dir=${SAR_LOG_DIR:logs}
