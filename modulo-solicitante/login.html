<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acceso de alumnado y aspirantes | Instituto Tecnológico de Toluca</title>
  <meta name="description" content="Acceso al sistema de solicitud de reducción de monto de inscripción para alumnos y aspirantes del Instituto Tecnológico de Toluca." />
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <!-- Font Awesome 4 (compatible con estilos ITT existentes) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />
  <!-- Estilos ITT -->
  <link rel="stylesheet" href="css/itt-base.css" />
  <link rel="stylesheet" href="css/solicitante.css" />
  <!-- Componentes comunes de seguridad (Equipo 1) -->
  <link rel="stylesheet" href="/compartido/css/itt-security.css" />
</head>
<body id="pagina-login-estudiante">
  <main class="login-wrapper">
    <div class="login-page-background">
      <header class="login-institucion">
        <img
          src="img/header.png"
          alt="Tecnológico Nacional de México — Instituto Tecnológico de Toluca"
          class="login-header-image"
        />
      </header>

      <nav class="login-portal-nav" aria-label="">
        <span>Gestión de Reducciones</span>
        <div class="tabs-tipo-usuario" role="tablist" aria-label="Tipo de acceso">
          <button class="tab-tipo activo" data-tipo="alumno" id="tab-alumno" role="tab" aria-selected="true" aria-controls="campos-alumno">
            Alumno
          </button>
          <button class="tab-tipo" data-tipo="aspirante" id="tab-aspirante" role="tab" aria-sPelected="false" aria-controls="campos-aspirante">
            Nuevo ingreso
          </button>
        </div>
      </nav>

    <section class="login-panel" aria-label="Acceso al sistema">
        <div class="login-panel__content">
          <section class="login-card login-form-panel" aria-labelledby="login-form-title">
            <header class="login-form-panel__header">
              <h1 class="login-subtitulo" id="login-form-title">Iniciar sesión</h1>
            </header>
            <div class="login-form-panel__body">

              <div id="alerta-login" aria-live="polite"></div>

              <form id="form-login-estudiante" novalidate>
              <div id="paso-credenciales">
                <div id="campos-alumno">
                  <div class="form-group">
                    <label for="numero-control">Número de Control <span class="requerido">*</span></label>
                    <input
                      type="text"
                      id="numero-control"
                      name="numero-control"
                      class="form-control-itt"
                      placeholder="Ej. B21281183"
                      maxlength="50"
                      autocomplete="username"
                    />
                    <span class="mensaje-error" id="numero-control-error"></span>
                  </div>
                  <div class="form-group">
                    <label for="password-alumno">Contraseña Institucional <span class="requerido">*</span></label>
                    <div class="login-password-field">
                      <input
                        type="password"
                        id="password-alumno"
                        name="password-alumno"
                        class="form-control-itt"
                        placeholder="Contraseña"
                        autocomplete="current-password"
                      />
                      <button
                        type="button"
                        id="toggle-password-alumno"
                        class="login-password-toggle"
                        aria-label="Mostrar contraseña"
                        aria-controls="password-alumno"
                        aria-pressed="false"
                      >Mostrar</button>
                    </div>
                    <span class="mensaje-error" id="password-alumno-error"></span>
                  </div>
                </div>

                <div id="campos-aspirante" hidden>
                  <div class="form-group">
                    <label for="curp-aspirante">CURP <span class="requerido">*</span></label>
                    <input
                      type="text"
                      id="curp-aspirante"
                      name="curp-aspirante"
                      class="form-control-itt input-mayusculas"
                      placeholder="Ej. LOML920101HDFPZS09"
                      maxlength="18"
                    />
                    <span class="mensaje-error" id="curp-aspirante-error"></span>
                  </div>
                  <div class="form-group">
                    <label for="folio-aspirante">Folio de Aspirante <span class="requerido">*</span></label>
                    <input
                      type="text"
                      id="folio-aspirante"
                      name="folio-aspirante"
                      class="form-control-itt"
                      placeholder="Folio de nuevo ingreso"
                    />
                    <span class="mensaje-error" id="folio-aspirante-error"></span>
                  </div>
                </div>

                <div id="captcha-login" data-itt-captcha></div>
              </div>

              <div id="paso-otp" hidden>
                <p class="itt-otp__ayuda">
                  Enviamos un código de 6 dígitos a <strong id="otp-destino"></strong>. Escríbalo para terminar de ingresar.
                </p>
                <div class="form-group">
                  <label for="codigo-otp">Código de verificación <span class="requerido">*</span></label>
                  <input
                    type="text"
                    id="codigo-otp"
                    name="codigo-otp"
                    class="form-control-itt itt-otp__campo"
                    inputmode="numeric"
                    autocomplete="one-time-code"
                    maxlength="6"
                  />
                </div>
                <div class="itt-captcha__acciones">
                  <button type="button" id="btn-otp-reenviar" class="itt-captcha__boton">Reenviar código</button>
                  <button type="button" id="btn-otp-cancelar" class="itt-captcha__boton">Volver al inicio de sesión</button>
                </div>
              </div>

              <button type="submit" id="btn-login" class="btn-itt btn-primario w-100 btn-login-submit">
                <span class="login-button-spinner" aria-hidden="true" hidden></span>
                <span class="login-button-text">Ingresar</span>
              </button>
              </form>

              <p class="login-ayuda">
                ¿Problemas para acceder? Contacte a la <strong>Subdirección Académica</strong>.
              </p>
            </div>
          </section>
        </div>
      </section>

      <footer class="login-page-footer">
        Instituto Tecnológico de Toluca <span aria-hidden="true">|</span> Subdirección Académica
      </footer>
    </div>
  </main>

  <script src="/compartido/js/itt-security.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
