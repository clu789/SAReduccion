<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inicio de Sesión – Solicitante | SAReducción ITT</title>
  <meta name="description" content="Acceso al sistema de solicitud de reducción de monto de inscripción para alumnos y aspirantes del Instituto Tecnológico de Toluca." />
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <!-- Font Awesome 4 (compatible con estilos ITT existentes) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />
  <!-- Estilos ITT -->
  <link rel="stylesheet" href="css/itt-base.css" />
  <link rel="stylesheet" href="css/solicitante.css" />
</head>
<body id="pagina-login-estudiante">

  <!-- ═══ SPINNER ═══ -->
  <div id="spinner-overlay" class="spinner-overlay">
    <div class="spinner-ring"></div>
  </div>

  <!-- ═══ LOGIN WRAPPER ═══ -->
  <div class="login-wrapper">
    <div class="login-card">

      <!-- Logo ITT -->
      <div class="login-logo">
        <img src="img/logo.png" alt="Instituto Tecnológico de Toluca" />
      </div>

      <!-- Título -->
      <h1>SAReducción</h1>
      <p class="login-subtitulo">
        Sistema de Solicitud de Reducción de Monto de Inscripción<br />
        <strong>Instituto Tecnológico de Toluca</strong>
      </p>

      <!-- Alertas -->
      <div id="alerta-login"></div>

      <!-- Tabs Alumno / Aspirante -->
      <div class="tabs-tipo-usuario" role="tablist">
        <button class="tab-tipo activo" data-tipo="alumno" id="tab-alumno" role="tab" aria-selected="true">
          <i class="fa fa-graduation-cap"></i> Alumno
        </button>
        <button class="tab-tipo" data-tipo="aspirante" id="tab-aspirante" role="tab" aria-selected="false">
          <i class="fa fa-user-plus"></i> Nuevo Ingreso
        </button>
      </div>

      <!-- Formulario de login -->
      <form id="form-login-estudiante" novalidate>

        <!-- Campos alumno -->
        <div id="campos-alumno">
          <div class="form-group">
            <label for="numero-control">Número de Control <span class="requerido">*</span></label>
            <input
              type="text"
              id="numero-control"
              name="numero-control"
              class="form-control-itt"
              placeholder="Ej. 20230001"
              maxlength="8"
              autocomplete="username"
            />
            <span class="mensaje-error" id="numero-control-error"></span>
          </div>
          <div class="form-group">
            <label for="password-alumno">Contraseña Institucional <span class="requerido">*</span></label>
            <input
              type="password"
              id="password-alumno"
              name="password-alumno"
              class="form-control-itt"
              placeholder="Contraseña"
              autocomplete="current-password"
            />
            <span class="mensaje-error" id="password-alumno-error"></span>
          </div>
        </div>

        <!-- Campos aspirante (nuevo ingreso) -->
        <div id="campos-aspirante" style="display:none;">
          <div class="form-group">
            <label for="curp-aspirante">CURP <span class="requerido">*</span></label>
            <input
              type="text"
              id="curp-aspirante"
              name="curp-aspirante"
              class="form-control-itt"
              placeholder="Ej. LOML920101HDFPZS09"
              maxlength="18"
              style="text-transform:uppercase;"
            />
            <span class="mensaje-error" id="curp-aspirante-error"></span>
          </div>
          <div class="form-group">
            <label for="folio-aspirante">Folio de Aspirante <span class="requerido">*</span></label>
            <input
              type="text"
              id="folio-aspirante"
              name="folio-aspirante"
              class="form-control-itt"
              placeholder="Folio de nuevo ingreso"
            />
            <span class="mensaje-error" id="folio-aspirante-error"></span>
          </div>
        </div>

        <button type="submit" id="btn-login" class="btn-itt btn-primario w-100" style="margin-top:8px;justify-content:center;">
          <i class="fa fa-sign-in"></i> Ingresar al Sistema
        </button>
      </form>

      <p style="text-align:center;margin-top:18px;font-size:.78rem;color:var(--itt-texto-claro);">
        ¿Problemas para acceder? Contacte a la <strong>Subdirección Académica</strong>.
      </p>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
