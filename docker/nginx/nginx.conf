server {
    listen 80;
    server_name localhost;

    # Resolver interno de Docker para resolver dinamicamente y evitar caidas al inicio
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $backend_upstream http://backend:8080;

    # Directorio raíz donde estarán mapeados los módulos
    root /usr/share/nginx/html;
    
    # Soporte para la página principal (Redirige al login del solicitante por defecto)
    location = / {
        return 301 $scheme://$http_host/solicitante/login.html;
    }

    # Proxy Reverso para la API (Resuelve el problema de CORS)
    # Toda petición que empiece con /api será enviada al contenedor del backend
    location /api/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Bloque para servir archivos estáticos correctamente y evitar errores 404
    location / {
        try_files $uri $uri/ =404;
    }
}

