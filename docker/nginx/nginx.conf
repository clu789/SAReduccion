# Oculta la version de Nginx en cabeceras y paginas de error.
server_tokens off;

server {
    listen 80;
    server_name localhost;

    # Resolver interno de Docker para resolver dinamicamente y evitar caidas al inicio
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $backend_upstream http://backend:8080;

    # Directorio raíz donde estarán mapeados los módulos
    root /usr/share/nginx/html;

    # Soporte para la página principal (Redirige al login del solicitante por defecto)
    location = / {
        return 301 $scheme://$http_host/solicitante/login.html;
    }

    # Proxy Reverso para la API (Resuelve el problema de CORS)
    # Toda petición que empiece con /api será enviada al contenedor del backend.
    # Las cabeceras de seguridad de la API las emite el propio backend.
    location /api/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        # IP real del cliente (Equipo 1). Nginx es el primer proxy de la cadena,
        # asi que SOBRESCRIBE estas cabeceras con la IP de la conexion: cualquier
        # X-Forwarded-For o X-Real-IP que mande el cliente se descarta y no puede
        # usarse para falsear el origen ni para evadir el limite de intentos.
        # Si se antepone otro proxy o balanceador de confianza, configurar aqui
        # set_real_ip_from / real_ip_header para ese equipo.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Bloque para servir archivos estáticos correctamente y evitar errores 404
    location / {
        try_files $uri $uri/ =404;

        # Cabeceras de seguridad de las paginas (Equipo 1).
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        # CSP: solo recursos propios mas las fuentes e iconos de los CDN que ya
        # usan las pantallas, sin scripts ni estilos en linea (RNF-66).
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        # HSTS: descomentar cuando el sitio se sirva por HTTPS.
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
}
